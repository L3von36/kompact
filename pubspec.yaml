name: kompact
description: "Kompact FMS — compact-design fleet management: live tracking, drivers, fuel, predictive maintenance, safety & compliance."
publish_to: 'none'

version: 2.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/LICENSE.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
        - asset: assets/fonts/Inter-Black.otf
          weight: 900
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/InterDisplay-Bold.otf
          weight: 700
